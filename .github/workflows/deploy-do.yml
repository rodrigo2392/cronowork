name: Deploy to DigitalOcean (PM2)

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build:frontend

      - name: Build Backend
        run: npm run build:backend

      - name: Prepare Deployment Artifacts
        run: |
          # Create a clean folder structure for transfer
          mkdir -p deploy_bundle/apps/frontend deploy_bundle/apps/backend

          # Copy compiled binaries
          cp -r apps/frontend/dist deploy_bundle/apps/frontend/
          cp -r apps/backend/dist deploy_bundle/apps/backend/

          # Copy package configs for server-side dependency installation
          cp package.json deploy_bundle/
          cp package-lock.json deploy_bundle/
          cp apps/backend/package.json deploy_bundle/apps/backend/
          cp apps/frontend/package.json deploy_bundle/apps/frontend/

      - name: Copy Artifacts to Droplet via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "deploy_bundle/*"
          target: "/var/www/cronowork_temp"
          strip_components: 1

      - name: Install Dependencies and Restart PM2 on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # 1. Ensure target directory exists
            mkdir -p /var/www/cronowork

            # 2. Sync new artifacts over to the live directory
            rsync -a /var/www/cronowork_temp/ /var/www/cronowork/
            rm -rf /var/www/cronowork_temp

            # 3. Navigate to live directory
            cd /var/www/cronowork

            # 4. Install strictly production dependencies
            npm ci --omit=dev || npm install --omit=dev

            # 5. Inject Environment Variables securely
            echo "OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}" > apps/backend/.env

            # 6. Start or Restart PM2
            pm2 restart cronowork || pm2 start apps/backend/dist/main.js --name cronowork

            # 7. Save PM2 process list to persist on server reboots
            pm2 save
